        <div class="text-item">🧠 スマホを使って隙間時間ですぐに始められる<br>　&nbsp;&nbsp;qAの補助ツールです</div>
        <div class="text-item">📝 試験でそのまま出る記述問題を<br>　&nbsp;&nbsp;そのまま覚えましょう</div>
        <div class="text-item">👻 画面上の任意の箇所をタップすることで<br>　&nbsp;&nbsp;マスクされた語句が段階的に表示されます</div>
        <div class="text-item">🤖 機械的な処理でマスクするため<br>　&nbsp;&nbsp;見当違いな箇所がマスクされることがあります</div>
    </div>

    <script>
        const items = document.querySelectorAll('.text-item');
        let currentIndex = 0;

        function changeText() {
            // 現在の要素を取得
            const currentItem = items[currentIndex];
            
            // 1. 下からフェードイン
            currentItem.classList.add('active');

            // 2. 2秒間表示させた後、上にフェードアウト
            setTimeout(() => {
                currentItem.classList.remove('active');
                currentItem.classList.add('exit');

                // 3. 次の要素へ（アニメーションが終わる頃に実行）
                setTimeout(() => {
                    currentItem.classList.remove('exit'); // 次の周回のためにリセット
                    
                    currentIndex = (currentIndex + 1) % items.length;
                    changeText(); // 再帰的に呼び出し
                }, 600); // transitionの時間(0.6s)と合わせる

            }, 3000); // 2秒間表示
        }

        // 最初の実行
        window.onload = changeText;
    </script>
